name: Test custom CHANGELOG path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: changelog
        uses: .
        with:
          path: ${{ github.workspace }}/tests/fixtures/CHANGELOG.md
          version: 1.0.0

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0" ]; then
            echo "FAIL: expected version '1.0.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is correct"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.changelog.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ "$ACTUAL" != "2023-12-01" ]; then
            echo "FAIL: expected date '2023-12-01', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: date is correct"

      - name: Assert status is released
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is released"

      - name: Assert changes contains first release content
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "First stable release"; then
            echo "FAIL: expected changes to contain 'First stable release'"
            exit 1
          fi
          echo "PASS: changes contains expected content"
