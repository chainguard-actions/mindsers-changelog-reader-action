name: Test changelog validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: changelog
        uses: .
        with:
          path: tests/fixtures/CHANGELOG.md
          version: 1.1.0
          validation_level: warn
          validation_depth: 5

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "1.1.0" ]; then
            echo "FAIL: expected version '1.1.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is correct"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.changelog.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ "$ACTUAL" != "2023-03-01" ]; then
            echo "FAIL: expected date '2023-03-01' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: date is correct"

      - name: Assert status output is released
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is released"

      - name: Assert changes output contains expected content
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Initial feature set"; then
            echo "FAIL: expected changes to contain 'Initial feature set'"
            exit 1
          fi
          echo "PASS: changes contains expected content"
