name: Test changelog validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: changelog
        uses: .
        with:
          path: ./CHANGELOG.md
          version: "2.2.2"
          validation_level: "warn"
          validation_depth: "5"

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "2.2.2" ]; then
            echo "FAIL: expected version '2.2.2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.changelog.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ "$ACTUAL" != "2022-11-23" ]; then
            echo "FAIL: expected date '2022-11-23', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert status is released
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes"
            exit 1
          fi
          echo "PASS"
