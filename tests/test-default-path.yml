name: Test default changelog path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a CHANGELOG.md in workspace root for default path test
        run: |
          cat > "$GITHUB_WORKSPACE/CHANGELOG.md" << 'EOF'
          # Changelog

          All notable changes to this project will be documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          ## [Unreleased]

          ## [3.0.0] - 2024-01-15

          ### Added

          - Default path test feature

          ## [2.0.0] - 2023-06-01

          ### Added

          - Previous release feature
          EOF

      - id: action
        uses: .
        with:
          version: "3.0.0"
          # Uses default path: ./CHANGELOG.md

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "3.0.0" ]; then
            echo "FAIL: expected version '3.0.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is correct"

      - name: Assert status is released
        env:
          ACTUAL: ${{ steps.action.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is released"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes"
            exit 1
          fi
          echo "PASS: changes is non-empty"
