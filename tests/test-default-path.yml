name: Test default CHANGELOG path with action's own changelog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's own CHANGELOG.md is at the action root, so we use it directly
      - id: changelog
        uses: .
        with:
          path: ./CHANGELOG.md
          version: 2.4.0

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "2.4.0" ]; then
            echo "FAIL: expected version '2.4.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version matches"

      - name: Assert status is released
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is released"

      - name: Assert changes contains expected content
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes"
            exit 1
          fi
          # Check that changes mention the new changes_file output
          if echo "$ACTUAL" | grep -q "changes_file"; then
            echo "PASS: changes contains expected content"
          else
            echo "FAIL: changes does not contain expected 'changes_file' text"
            exit 1
          fi
