name: Test basic usage - read specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: changelog
        uses: .
        with:
          path: ${{ github.workspace }}/tests/fixtures/CHANGELOG.md
          version: 1.2.0

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "1.2.0" ]; then
            echo "FAIL: expected version '1.2.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is correct"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.changelog.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ "$ACTUAL" != "2024-03-15" ]; then
            echo "FAIL: expected date '2024-03-15', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: date is correct"

      - name: Assert status output
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is correct"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes"
            exit 1
          fi
          echo "PASS: changes is non-empty"

      - name: Assert changes contains expected content
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Feature A"; then
            echo "FAIL: expected changes to contain 'Feature A'"
            exit 1
          fi
          echo "PASS: changes contains expected content"

      - name: Assert changes_file output exists
        env:
          CHANGES_FILE: ${{ steps.changelog.outputs.changes_file }}
        run: |
          echo "changes_file path: $CHANGES_FILE"
          if [ -z "$CHANGES_FILE" ]; then
            echo "FAIL: expected changes_file to be set"
            exit 1
          fi
          if [ ! -f "$CHANGES_FILE" ]; then
            echo "FAIL: changes_file does not exist at path: $CHANGES_FILE"
            exit 1
          fi
          echo "PASS: changes_file exists"
