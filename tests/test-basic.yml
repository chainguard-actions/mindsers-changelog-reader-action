name: Test basic usage - read specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: changelog
        uses: .
        with:
          version: "2.3.0"
          path: "./CHANGELOG.md"

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "2.3.0" ]; then
            echo "FAIL: expected version '2.3.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is correct"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.changelog.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ "$ACTUAL" != "2026-05-19" ]; then
            echo "FAIL: expected date '2026-05-19', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: date is correct"

      - name: Assert status output
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is correct"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes"
            exit 1
          fi
          echo "PASS: changes is non-empty"
