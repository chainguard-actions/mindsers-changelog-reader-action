name: Test unreleased section
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: changelog
        uses: .
        with:
          path: ${{ github.workspace }}/tests/fixtures/CHANGELOG.md
          version: Unreleased

      - name: Assert version output is Unreleased
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "Unreleased" ]; then
            echo "FAIL: expected version 'Unreleased', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is Unreleased"

      - name: Assert status is unreleased
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "unreleased" ]; then
            echo "FAIL: expected status 'unreleased', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is unreleased"

      - name: Assert changes output contains unreleased content
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "upcoming feature"; then
            echo "FAIL: expected changes to contain 'upcoming feature'"
            exit 1
          fi
          echo "PASS: changes contains unreleased content"
