name: Test unreleased section
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/CHANGELOG.md
          version: "Unreleased"

      - name: Assert status is unreleased
        env:
          ACTUAL: ${{ steps.action.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "unreleased" ]; then
            echo "FAIL: expected status 'unreleased', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is unreleased"

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "Unreleased" ]; then
            echo "FAIL: expected version 'Unreleased', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is Unreleased"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes for Unreleased section"
            exit 1
          fi
          echo "PASS: changes is non-empty"
