name: Test unreleased section
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: changelog
        uses: .
        with:
          path: tests/fixtures/CHANGELOG.md
          version: Unreleased

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          # The version for unreleased should be "Unreleased" (case-insensitive check)
          if ! echo "$ACTUAL" | grep -qi "unreleased"; then
            echo "FAIL: expected version to contain 'Unreleased' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is Unreleased"

      - name: Assert status output is unreleased
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "unreleased" ]; then
            echo "FAIL: expected status 'unreleased' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is unreleased"

      - name: Assert changes output contains unreleased content
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "unreleased feature"; then
            echo "FAIL: expected changes to contain 'unreleased feature'"
            exit 1
          fi
          echo "PASS: changes contains unreleased content"
