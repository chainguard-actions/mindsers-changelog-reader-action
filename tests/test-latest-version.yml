name: Test latest version (no version specified)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: changelog
        uses: .
        with:
          path: ${{ github.workspace }}/CHANGELOG.md
          # No version specified - should return the latest released version

      - name: Assert version output is non-empty
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty version output"
            exit 1
          fi
          echo "PASS: version is non-empty: $ACTUAL"

      - name: Assert status output is non-empty
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty status output"
            exit 1
          fi
          echo "PASS: status is non-empty: $ACTUAL"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes output"
            exit 1
          fi
          echo "PASS: changes is non-empty"
