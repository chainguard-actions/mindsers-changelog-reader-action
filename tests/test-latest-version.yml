name: Test latest version (no version specified)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/CHANGELOG.md
          # No version specified - should return the latest released version

      - name: Assert version output is latest
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "1.2.0" ]; then
            echo "FAIL: expected latest version '1.2.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: latest version is correct"

      - name: Assert status is released
        env:
          ACTUAL: ${{ steps.action.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is released"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.action.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ "$ACTUAL" != "2023-06-15" ]; then
            echo "FAIL: expected date '2023-06-15', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: date is correct"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes"
            exit 1
          fi
          echo "PASS: changes is non-empty"
