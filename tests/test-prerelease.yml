name: Test pre-release version status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/CHANGELOG-prerelease.md
          version: "2.0.0-beta.1"

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "2.0.0-beta.1" ]; then
            echo "FAIL: expected version '2.0.0-beta.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is correct"

      - name: Assert status is prereleased
        env:
          ACTUAL: ${{ steps.action.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "prereleased" ]; then
            echo "FAIL: expected status 'prereleased', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is prereleased"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.action.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ "$ACTUAL" != "2023-08-01" ]; then
            echo "FAIL: expected date '2023-08-01', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: date is correct"

      - name: Assert changes output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes for pre-release entry"
            exit 1
          fi
          echo "PASS: changes is non-empty"
