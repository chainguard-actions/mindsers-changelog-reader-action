name: Test reading action own CHANGELOG
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: changelog
        uses: .
        with:
          # Use a fixture that mirrors the action's CHANGELOG.md content
          # (the action/CHANGELOG.md is a symlink that may not resolve in the container)
          path: ${{ github.workspace }}/tests/fixtures/ACTION-CHANGELOG.md
          version: 2.4.0

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.changelog.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "2.4.0" ]; then
            echo "FAIL: expected version '2.4.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version is correct"

      - name: Assert date output
        env:
          ACTUAL: ${{ steps.changelog.outputs.date }}
        run: |
          echo "actual date: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected date to be set"
            exit 1
          fi
          echo "PASS: date is set: $ACTUAL"

      - name: Assert status is released
        env:
          ACTUAL: ${{ steps.changelog.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "released" ]; then
            echo "FAIL: expected status 'released', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: status is released"

      - name: Assert changes is non-empty
        env:
          ACTUAL: ${{ steps.changelog.outputs.changes }}
        run: |
          echo "actual changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty changes"
            exit 1
          fi
          echo "PASS: changes is non-empty"

      - name: Assert changes_file output exists and has content
        env:
          CHANGES_FILE: ${{ steps.changelog.outputs.changes_file }}
        run: |
          echo "changes_file path: $CHANGES_FILE"
          if [ -z "$CHANGES_FILE" ]; then
            echo "FAIL: expected changes_file to be set"
            exit 1
          fi
          if [ ! -f "$CHANGES_FILE" ]; then
            echo "FAIL: changes_file does not exist at path: $CHANGES_FILE"
            exit 1
          fi
          CONTENT=$(cat "$CHANGES_FILE")
          if [ -z "$CONTENT" ]; then
            echo "FAIL: changes_file is empty"
            exit 1
          fi
          echo "PASS: changes_file exists and has content"
          echo "Content preview: $(head -3 "$CHANGES_FILE")"
